<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albireo Panel</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #2563eb; --user: #eff6ff; --warn: #b45309; --warn-bg: #fffbeb; --err: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1c1b1a; --text: #e7e5e4; --muted: #a8a29e; --line: #2e2c2a;
      --accent: #60a5fa; --user: #1e2a3d; --warn: #fbbf24; --warn-bg: #2a2314; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.running { color: var(--accent); border-color: var(--accent); }
  .spacer { flex: 1; }
  select, input, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; white-space: pre-wrap; word-break: break-word; }
  .user { background: var(--user); padding: 8px 12px; border-radius: 8px; }
  .reasoning { color: var(--muted); font-size: 13px; font-style: italic; }
  .tool { font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 10px; }
  .tool .name { color: var(--accent); }
  .tool pre { margin: 6px 0 0; max-height: 180px; overflow: auto; white-space: pre-wrap; color: var(--muted); }
  .tool.err .name { color: var(--err); }
  .notice { color: var(--muted); font-size: 13px; text-align: center; }
  .error { color: var(--err); }
  .approval { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; }
  .approval code { display: block; font-family: var(--mono); font-size: 13px; margin: 6px 0; white-space: pre-wrap; }
  .approval .row { display: flex; gap: 8px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; }
  footer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  footer input { flex: 1; }
  .badge { display: inline-block; margin-left: 6px; min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--warn); color: var(--panel); font-size: 11px; line-height: 16px; text-align: center; }
  dialog { width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 16px; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dlg-head h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .stack { display: grid; gap: 6px; }
  .stack label { font-size: 12px; color: var(--muted); }
  .stack input:not([type="checkbox"]), .stack select { width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .check input { width: auto; margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prov { border-top: 1px solid var(--line); padding: 12px 0; }
  .prov-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .prov-head h3 { font-size: 14px; margin: 0; }
  .prov-head .spacer { flex: 1; }
  .pill.ok { color: var(--accent); border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  details.prov summary { cursor: pointer; font-size: 14px; font-weight: 600; user-select: none; }
  details.prov[open] summary { margin-bottom: 10px; }
  #keys-config-err { margin: 6px 0; font-size: 13px; color: var(--err); }
  #keys-msg { min-height: 1.5em; margin: 8px 0 0; font-size: 13px; }
  #keys-msg.err { color: var(--err); }
  @media (max-width: 520px) { header .spacer { display: none; } .grid2 { grid-template-columns: 1fr; } }
  /* Last, so it beats the display rules above that share its specificity. */
  [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Albireo</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="where"></span>
  <span class="spacer"></span>
  <select id="provider" aria-label="Provider"></select>
  <input id="model" list="model-options" placeholder="model (default)" size="18" aria-label="Model">
  <datalist id="model-options"></datalist>
  <button id="switch" type="button">Switch</button>
  <button id="abort" type="button" disabled>Stop</button>
  <button id="keys-open" type="button" hidden>API Keys<span id="keys-badge" class="badge" hidden>!</span></button>
</header>
<dialog id="keys" aria-labelledby="keys-title">
  <div class="dlg-head">
    <h2 id="keys-title">API Keys &amp; Providers</h2>
    <button id="keys-close" type="button" aria-label="Close">×</button>
  </div>
  <p id="keys-state" class="muted"></p>
  <p id="keys-config-err" hidden></p>
  <form id="unlock-form" class="stack" hidden>
    <label for="passphrase">Passphrase</label>
    <input id="passphrase" type="password" autocomplete="current-password" required>
    <div id="confirm-row" class="stack" hidden>
      <label for="passphrase2">Repeat passphrase</label>
      <input id="passphrase2" type="password" autocomplete="new-password">
    </div>
    <div class="actions"><button id="unlock-submit" type="submit" class="primary">Unlock</button></div>
  </form>
  <div id="provider-forms"></div>
  <details id="custom-provider-box" class="prov">
    <summary>Add custom provider</summary>
    <form id="custom-provider-form" class="stack">
      <div class="grid2">
        <div class="stack">
          <label for="cp-id">Provider ID</label>
          <input id="cp-id" type="text" placeholder="e.g. deepseek, ollama" pattern="[a-z0-9][a-z0-9._-]{0,63}" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="stack">
          <label for="cp-name">Display name (optional)</label>
          <input id="cp-name" type="text" placeholder="e.g. DeepSeek" autocomplete="off">
        </div>
      </div>
      <div class="grid2">
        <div class="stack">
          <label for="cp-api">Wire API</label>
          <select id="cp-api">
            <option value="openai-completions">openai-completions</option>
            <option value="anthropic-messages">anthropic-messages</option>
          </select>
        </div>
        <div class="stack">
          <label for="cp-auth">Authentication</label>
          <select id="cp-auth">
            <option value="api-key">API key (vault)</option>
            <option value="bearer">Bearer token (vault)</option>
            <option value="none">None (local endpoint)</option>
          </select>
        </div>
      </div>
      <label for="cp-base">Base URL</label>
      <input id="cp-base" type="url" placeholder="https://api.deepseek.com/v1" autocomplete="off" spellcheck="false" required>
      <div class="grid2">
        <div class="stack">
          <label for="cp-model">Default model</label>
          <input id="cp-model" type="text" placeholder="e.g. deepseek-chat" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="stack">
          <label for="cp-models">Extra models (comma-separated)</label>
          <input id="cp-models" type="text" placeholder="e.g. deepseek-reasoner" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div id="cp-compat-openai" class="stack">
        <label for="cp-max-tokens">Max tokens parameter</label>
        <select id="cp-max-tokens">
          <option value="max_completion_tokens">max_completion_tokens (default)</option>
          <option value="max_tokens">max_tokens (legacy / DeepSeek / local)</option>
        </select>
        <label class="check"><input id="cp-stream-usage" type="checkbox" checked> Request usage in streaming (stream_options)</label>
        <label class="check"><input id="cp-non-null" type="checkbox"> Send empty string instead of null for tool-only assistant turns</label>
        <label class="check"><input id="cp-dev-role" type="checkbox"> Send system prompt as developer role</label>
      </div>
      <div id="cp-compat-anthropic" class="stack" hidden>
        <label for="cp-thinking">Thinking mode</label>
        <select id="cp-thinking">
          <option value="none">none (compatible default)</option>
          <option value="adaptive">adaptive</option>
        </select>
        <label class="check"><input id="cp-eager" type="checkbox"> Eager tool input streaming (beta)</label>
        <label class="check"><input id="cp-fallbacks" type="checkbox"> Enable Anthropic fallbacks</label>
      </div>
      <div id="cp-key-row" class="stack">
        <label for="cp-key">API key (optional — saved encrypted in vault)</label>
        <input id="cp-key" type="password" placeholder="leave blank to set later" autocomplete="off" spellcheck="false">
      </div>
      <div class="actions"><button id="cp-submit" type="submit" class="primary">Save custom provider</button></div>
    </form>
  </details>
  <div class="actions"><button id="lock-btn" type="button" hidden>Lock vault</button></div>
  <p id="keys-msg" role="status"></p>
</dialog>
<main id="log"></main>
<footer>
  <!-- biome-ignore lint/a11y/noAutofocus: the message box is the panel's only primary input -->
  <form id="form"><input id="text" placeholder="Message Albireo…" autocomplete="off" autofocus><button type="submit" class="primary">Send</button></form>
</footer>
<script type="module">
const token = new URLSearchParams(location.search).get("token") ?? "";
const $ = (id) => document.getElementById(id);
const log = $("log");
let live = null;        // {el, reasoningEl, textEl}
let running = false;
const approvals = new Map();

function add(cls, text) {
  const el = document.createElement("div");
  el.className = `msg ${cls}`;
  el.textContent = text ?? "";
  log.appendChild(el);
  scroll();
  return el;
}
function scroll() { log.scrollTop = log.scrollHeight; }
function json(v) { try { return JSON.stringify(v, null, 2); } catch { return String(v); } }

function ensureLive() {
  if (live) return live;
  const el = document.createElement("div");
  el.className = "msg";
  const reasoningEl = document.createElement("div"); reasoningEl.className = "reasoning";
  const textEl = document.createElement("div");
  el.append(reasoningEl, textEl);
  log.appendChild(el);
  live = { el, reasoningEl, textEl };
  return live;
}

function setStatus(state) {
  running = state === "running";
  $("status").textContent = state;
  $("status").classList.toggle("running", running);
  $("abort").disabled = !running;
  $("switch").disabled = running;
}

function setWhere(provider, model) {
  $("where").textContent = `${provider} · ${model}`;
  currentProvider = provider;
  renderKeys();
}

// ---- API keys & custom providers (vault + providers.json) ----
const forms = new Map();
let secrets = null;
let currentProvider = null;

async function api(path, body, method) {
  const headers = { "x-albireo-token": token };
  const resolvedMethod = method ?? (body === undefined ? "GET" : "POST");
  const init = body === undefined
    ? { method: resolvedMethod, headers }
    : { method: resolvedMethod, headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? `request failed (${res.status})`);
  return data;
}

async function loadSecrets() {
  try { secrets = await api("/secrets"); } catch { secrets = null; }
  renderKeys();
}

function keysMsg(text, isError = false) {
  $("keys-msg").textContent = text;
  $("keys-msg").classList.toggle("err", isError);
}

function describeVault(s) {
  if (s.error) return s.error;
  const holder = s.keychain ?? "your OS credential store";
  if (s.state === "uninitialized") {
    return s.protection === "os-keychain"
      ? `No keys saved yet. They will be encrypted with a key held by ${holder}.`
      : "No keys saved yet. No OS credential store is available here, so choose a passphrase (at least 8 characters) to protect them.";
  }
  if (s.state === "locked") return "The vault is locked. Enter its passphrase to use the saved keys.";
  return s.protection === "passphrase" ? "Keys are encrypted with your passphrase." : `Keys are encrypted with a key held by ${holder}.`;
}

function addField(parent, id, label, type) {
  const wrap = document.createElement("div");
  wrap.className = "stack";
  const l = document.createElement("label");
  l.htmlFor = id;
  l.textContent = label;
  const input = document.createElement("input");
  input.id = id;
  input.type = type;
  input.autocomplete = "off";
  input.spellcheck = false;
  wrap.append(l, input);
  parent.append(wrap);
  return { wrap, label: l, input };
}

function syncHeaderProviders(s) {
  if (!s?.enabled || !Array.isArray(s.providerOrder)) return;
  const sel = $("provider");
  const prev = sel.value || currentProvider;
  const nextSelected = s.providerOrder.includes(prev) ? prev : (currentProvider ?? s.providerOrder[0] ?? "");
  sel.replaceChildren(...s.providerOrder.map((id) => {
    const view = s.providers[id];
    const label = view && view.name.toLowerCase() !== id ? `${id} (${view.name})` : id;
    return new Option(label, id, false, id === nextSelected);
  }));
  syncModelSuggestions();
}

function syncModelSuggestions() {
  const list = $("model-options");
  const selected = $("provider").value || currentProvider;
  const view = secrets?.enabled && selected ? secrets.providers[selected] : null;
  if (!view) {
    list.replaceChildren();
    return;
  }
  const ids = new Set();
  if (view.model) ids.add(view.model);
  if (view.defaultModel) ids.add(view.defaultModel);
  for (const m of view.models ?? []) ids.add(m.id);
  list.replaceChildren(...[...ids].map((m) => {
    const opt = document.createElement("option");
    opt.value = m;
    return opt;
  }));
}

function buildProviderForm(id) {
  const form = document.createElement("form");
  form.className = "prov stack";
  const head = document.createElement("div");
  head.className = "prov-head";
  const h = document.createElement("h3");
  const apiBadge = document.createElement("span");
  apiBadge.className = "pill";
  const badge = document.createElement("span");
  badge.className = "pill";
  const spacer = document.createElement("span");
  spacer.className = "spacer";
  const del = document.createElement("button");
  del.type = "button";
  del.className = "danger";
  del.textContent = "Delete";
  head.append(h, apiBadge, badge, spacer, del);
  form.append(head);

  const fields = document.createElement("div");
  fields.className = "stack";
  const keyField = addField(fields, `prov-${id}-key`, "API key", "password");
  const baseField = addField(fields, `prov-${id}-base`, "Base URL override (optional)", "url");
  const modelField = addField(fields, `prov-${id}-model`, "Model override (optional)", "text");
  const modelList = document.createElement("datalist");
  modelList.id = `prov-${id}-models`;
  modelField.input.setAttribute("list", modelList.id);
  fields.append(modelList);

  const row = document.createElement("div");
  row.className = "actions";
  const save = document.createElement("button");
  save.type = "submit";
  save.className = "primary";
  save.textContent = "Save";
  const clear = document.createElement("button");
  clear.type = "button";
  clear.textContent = "Clear key";
  row.append(save, clear);
  fields.append(row);
  form.append(fields);

  for (const input of [baseField.input, modelField.input]) {
    input.addEventListener("input", () => { form.dataset.dirty = "1"; });
  }
  form.onsubmit = (e) => {
    e.preventDefault();
    // Only send overrides the user edited, so saving a key never rewrites them.
    const patch = form.dataset.dirty
      ? { baseURL: baseField.input.value.trim(), model: modelField.input.value.trim() }
      : {};
    if (keyField.input.value.trim()) patch.apiKey = keyField.input.value.trim();
    if (Object.keys(patch).length === 0) {
      keysMsg("Nothing to save.");
      return;
    }
    saveProvider(id, patch);
  };
  clear.onclick = () => saveProvider(id, { clearApiKey: true });
  del.onclick = () => deleteProvider(id);

  const entry = {
    form,
    title: h,
    apiBadge,
    badge,
    del,
    fields,
    keyWrap: keyField.wrap,
    keyLabel: keyField.label,
    key: keyField.input,
    base: baseField.input,
    model: modelField.input,
    modelList,
    clear,
  };
  forms.set(id, entry);
  return entry;
}

function renderProviderForm(id, view, formsUsable, vaultLocked) {
  let f = forms.get(id);
  if (!f) f = buildProviderForm(id);
  f.title.textContent = view.name === id ? id : `${view.name} (${id})`;
  f.apiBadge.textContent = view.api;
  if (view.auth === "none") {
    f.badge.textContent = "no key needed";
    f.badge.classList.add("ok");
  } else {
    f.badge.textContent = view.hasKey ? "encrypted" : "not configured";
    f.badge.classList.toggle("ok", view.hasKey);
  }

  f.del.hidden = view.builtin;
  const isActive = id === currentProvider;
  f.del.disabled = isActive || vaultLocked;
  f.del.title = isActive
    ? "Switch to another provider before deleting"
    : vaultLocked
      ? "Unlock the vault before deleting, so the stored key is deleted too"
      : `Delete custom provider ${id}`;

  f.fields.hidden = !formsUsable;
  const noAuth = view.auth === "none";
  f.keyWrap.hidden = noAuth;
  f.keyLabel.textContent = view.auth === "bearer" ? "Bearer token" : "API key";
  f.key.placeholder = view.hasKey
    ? `configured (${view.keyHint}) — leave blank to keep`
    : (view.auth === "bearer" ? "paste bearer token" : "paste API key");
  f.clear.hidden = noAuth || !view.hasKey;

  f.base.placeholder = view.defaultBaseURL;
  f.model.placeholder = view.defaultModel;
  const modelIds = new Set([view.defaultModel, ...(view.models ?? []).map((m) => m.id)]);
  f.modelList.replaceChildren(...[...modelIds].map((m) => {
    const opt = document.createElement("option");
    opt.value = m;
    return opt;
  }));

  if (!f.form.dataset.dirty) {
    f.base.value = view.baseURL ?? "";
    f.model.value = view.model ?? "";
  }
  return f.form;
}

function syncCustomProviderFields() {
  const isAnthropic = $("cp-api").value === "anthropic-messages";
  $("cp-compat-openai").hidden = isAnthropic;
  $("cp-compat-anthropic").hidden = !isAnthropic;
  const formsUsable = Boolean(
    secrets?.enabled &&
      (secrets.state === "unlocked" || (secrets.state === "uninitialized" && secrets.protection === "os-keychain")),
  );
  const auth = $("cp-auth").value;
  $("cp-key-row").hidden = auth === "none" || !formsUsable;
  // The server refuses new providers until a passphrase vault is unlocked, like deletes.
  const submit = $("cp-submit");
  submit.disabled = passphraseLocked(secrets);
  submit.title = submit.disabled ? "Unlock the vault before adding a provider" : "";
}

function passphraseLocked(s) {
  return Boolean(s?.enabled && s.state === "locked" && !s.error);
}

function renderKeys() {
  const open = $("keys-open");
  const s = secrets;
  open.hidden = !s?.enabled;
  if (!s?.enabled) return;

  syncHeaderProviders(s);

  const current = currentProvider && s.providers[currentProvider];
  const needsVault = current?.auth !== "none";
  const attention = Boolean(s.error || s.configError) || (needsVault && (s.state !== "unlocked" || !current?.configured));
  $("keys-badge").hidden = !attention;
  open.setAttribute("aria-label", attention ? "API Keys (needs attention)" : "API Keys");
  open.title = attention
    ? (s.configError ?? (s.state === "unlocked" ? `No ${currentProvider} key saved` : describeVault(s)))
    : "";

  const formsUsable = s.state === "unlocked" || (s.state === "uninitialized" && s.protection === "os-keychain");
  const creating = s.state === "uninitialized";
  $("keys-state").textContent = describeVault(s);
  const cfgErr = $("keys-config-err");
  cfgErr.hidden = !s.configError;
  cfgErr.textContent = s.configError ? `providers.json: ${s.configError}` : "";

  $("unlock-form").hidden = formsUsable || s.protection !== "passphrase";
  $("confirm-row").hidden = !creating;
  $("passphrase").autocomplete = creating ? "new-password" : "current-password";
  $("passphrase2").required = creating;
  $("unlock-submit").textContent = creating ? "Create vault" : "Unlock";
  $("lock-btn").hidden = !(s.state === "unlocked" && s.protection === "passphrase");

  const order = s.providerOrder ?? Object.keys(s.providers);
  const keep = new Set(order);
  for (const [id, entry] of forms) {
    if (!keep.has(id)) {
      entry.form.remove();
      forms.delete(id);
    }
  }
  const container = $("provider-forms");
  for (const id of order) {
    const view = s.providers[id];
    if (!view) continue;
    const formEl = renderProviderForm(id, view, formsUsable, passphraseLocked(s));
    if (formEl.parentElement !== container) container.appendChild(formEl);
  }
  syncCustomProviderFields();
}

async function saveProvider(id, patch) {
  keysMsg("Saving…");
  try {
    secrets = await api("/secrets/provider", { provider: id, ...patch });
    const f = forms.get(id);
    if (f) {
      f.key.value = "";
      // Only a save that sent the overrides makes them clean; "Clear key" keeps unsaved edits.
      if (patch.baseURL !== undefined) delete f.form.dataset.dirty;
    }
    renderKeys();
    keysMsg(secrets.refreshPending ? "Saved. It takes effect when the current turn ends." : "Saved.");
  } catch (err) {
    keysMsg(err.message, true);
  }
}

async function deleteProvider(id) {
  keysMsg(`Deleting ${id}…`);
  try {
    secrets = await api(`/providers/${encodeURIComponent(id)}`, undefined, "DELETE");
    renderKeys();
    keysMsg(`Deleted custom provider "${id}".`);
  } catch (err) {
    keysMsg(err.message, true);
  }
}

function clearSecretInputs() {
  for (const f of forms.values()) f.key.value = "";
  $("cp-key").value = "";
  $("passphrase").value = "";
  $("passphrase2").value = "";
}

$("cp-api").addEventListener("change", syncCustomProviderFields);
$("cp-auth").addEventListener("change", syncCustomProviderFields);
$("provider").addEventListener("change", syncModelSuggestions);

$("custom-provider-form").onsubmit = async (e) => {
  e.preventDefault();
  const id = $("cp-id").value.trim();
  const name = $("cp-name").value.trim();
  const apiType = $("cp-api").value;
  const auth = $("cp-auth").value;
  const baseURL = $("cp-base").value.trim();
  const defaultModel = $("cp-model").value.trim();
  const extraModels = $("cp-models").value
    .split(",")
    .map((m) => m.trim())
    .filter(Boolean);
  const modelIds = [...new Set([defaultModel, ...extraModels].filter(Boolean))];
  const compat = apiType === "anthropic-messages"
    ? {
        thinkingMode: $("cp-thinking").value,
        supportsEagerToolInputStreaming: $("cp-eager").checked,
        supportsFallbacks: $("cp-fallbacks").checked,
      }
    : {
        maxTokensField: $("cp-max-tokens").value,
        supportsUsageInStreaming: $("cp-stream-usage").checked,
        requiresNonNullAssistantContent: $("cp-non-null").checked,
        supportsDeveloperRole: $("cp-dev-role").checked,
      };
  const payload = {
    id,
    ...(name ? { name } : {}),
    api: apiType,
    auth,
    baseURL,
    defaultModel,
    ...(modelIds.length > 0 ? { models: modelIds.map((m) => ({ id: m })) } : {}),
    compat,
  };
  const initialKey = $("cp-key").value.trim();
  keysMsg("Saving custom provider…");
  try {
    secrets = await api("/providers", payload);
  } catch (err) {
    keysMsg(err.message, true);
    return;
  }
  $("custom-provider-form").reset();
  $("cp-key").value = "";
  $("custom-provider-box").open = false;
  renderKeys();
  // The provider is saved either way; a key that fails can be entered in its own form.
  if (auth !== "none" && initialKey) {
    try {
      secrets = await api("/secrets/provider", { provider: id, apiKey: initialKey });
      renderKeys();
    } catch (err) {
      keysMsg(`Saved custom provider "${id}", but not its key: ${err.message}`, true);
      return;
    }
  }
  keysMsg(`Saved custom provider "${id}".`);
};

$("keys-open").onclick = () => { keysMsg(""); renderKeys(); $("keys").showModal(); loadSecrets(); };
$("keys-close").onclick = () => $("keys").close();
$("keys").addEventListener("close", clearSecretInputs);
$("unlock-form").onsubmit = async (e) => {
  e.preventDefault();
  const passphrase = $("passphrase").value;
  if (secrets?.state === "uninitialized" && passphrase !== $("passphrase2").value) {
    keysMsg("The passphrases do not match.", true);
    return;
  }
  try {
    secrets = await api("/secrets/unlock", { passphrase });
    clearSecretInputs();
    renderKeys();
    keysMsg("Unlocked.");
  } catch (err) {
    keysMsg(err.message, true);
  }
};
$("lock-btn").onclick = async () => {
  try {
    secrets = await api("/secrets/lock", {});
    renderKeys();
    keysMsg("Locked.");
  } catch (err) {
    keysMsg(err.message, true);
  }
};

function approvalCard(ev) {
  const el = document.createElement("div");
  el.className = "msg approval";
  el.innerHTML = "<strong></strong><code></code><div class='row'><button class='primary'>Allow</button><button>Deny</button></div>";
  el.querySelector("strong").textContent = `Allow ${ev.name} (${ev.risk})?`;
  el.querySelector("code").textContent = json(ev.input);
  const [allow, deny] = el.querySelectorAll("button");
  allow.onclick = () => command({ type: "approve", id: ev.id, allow: true });
  deny.onclick = () => command({ type: "approve", id: ev.id, allow: false });
  approvals.set(ev.id, el);
  log.appendChild(el);
  scroll();
}

function toolCard(ev) {
  const el = document.createElement("div");
  el.className = "msg tool";
  el.id = `call-${ev.id}`;
  el.innerHTML = "<span class='name'></span> <span class='args'></span>";
  el.querySelector(".name").textContent = ev.name;
  el.querySelector(".args").textContent = JSON.stringify(ev.input);
  log.appendChild(el);
  scroll();
}

function handle(ev) {
  switch (ev.type) {
    case "snapshot":
      log.replaceChildren(); live = null; approvals.clear();
      for (const e of ev.log) handle(e);
      if (ev.live) { const l = ensureLive(); l.reasoningEl.textContent = ev.live.reasoning; l.textEl.textContent = ev.live.text; }
      for (const p of ev.pending) approvalCard(p);
      setStatus(ev.status); setWhere(ev.provider, ev.model);
      $("provider").replaceChildren(...ev.providers.map((p) => new Option(p, p, false, p === ev.provider)));
      loadSecrets();
      break;
    case "secrets_changed": loadSecrets(); break;
    case "user": add("user", ev.text); break;
    case "text_delta": ensureLive().textEl.textContent += ev.text; scroll(); break;
    case "reasoning_delta": ensureLive().reasoningEl.textContent += ev.text; scroll(); break;
    case "assistant_end": {
      if (!live && ev.text) { const l = ensureLive(); l.textEl.textContent = ev.text; }
      if (live && !live.textEl.textContent && !live.reasoningEl.textContent) live.el.remove();
      live = null;
      break;
    }
    case "tool_call": toolCard(ev); break;
    case "approval_request": approvalCard(ev); break;
    case "approval_resolved": approvals.get(ev.id)?.remove(); approvals.delete(ev.id); break;
    case "tool_result": {
      const card = $(`call-${ev.id}`);
      if (!card) break;
      if (ev.isError) card.classList.add("err");
      const pre = document.createElement("pre"); pre.textContent = ev.content;
      card.appendChild(pre); scroll();
      break;
    }
    case "provider_changed": setWhere(ev.provider, ev.model); $("provider").value = ev.provider; syncModelSuggestions(); add("notice", `Switched to ${ev.provider} · ${ev.model}`); break;
    case "status": setStatus(ev.state); break;
    case "notice": add("notice", ev.text); break;
    case "error": add("error", ev.message); break;
  }
}

async function command(body) {
  const res = await fetch("/command", { method: "POST", headers: { "content-type": "application/json", "x-albireo-token": token }, body: JSON.stringify(body) });
  if (!res.ok) add("error", (await res.json().catch(() => ({}))).error ?? "request failed");
}

const es = new EventSource(`/events?token=${encodeURIComponent(token)}`);
es.onmessage = (e) => handle(JSON.parse(e.data));
es.onerror = () => { $("status").textContent = "disconnected"; $("status").classList.remove("running"); };

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  command({ type: "send", text });
};
$("abort").onclick = () => command({ type: "abort" });
$("switch").onclick = () => command({ type: "switch", provider: $("provider").value, model: $("model").value.trim() });
</script>
</body>
