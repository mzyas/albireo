<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albireo Panel</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #2563eb; --user: #eff6ff; --warn: #b45309; --warn-bg: #fffbeb; --err: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1c1b1a; --text: #e7e5e4; --muted: #a8a29e; --line: #2e2c2a;
      --accent: #60a5fa; --user: #1e2a3d; --warn: #fbbf24; --warn-bg: #2a2314; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.running { color: var(--accent); border-color: var(--accent); }
  .spacer { flex: 1; }
  select, input, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; white-space: pre-wrap; word-break: break-word; }
  .user { background: var(--user); padding: 8px 12px; border-radius: 8px; }
  .reasoning { color: var(--muted); font-size: 13px; font-style: italic; }
  .tool { font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 10px; }
  .tool .name { color: var(--accent); }
  .tool pre { margin: 6px 0 0; max-height: 180px; overflow: auto; white-space: pre-wrap; color: var(--muted); }
  .tool.err .name { color: var(--err); }
  .notice { color: var(--muted); font-size: 13px; text-align: center; }
  .error { color: var(--err); }
  .approval { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; }
  .approval code { display: block; font-family: var(--mono); font-size: 13px; margin: 6px 0; white-space: pre-wrap; }
  .approval .row { display: flex; gap: 8px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; }
  footer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  footer input { flex: 1; }
  .badge { display: inline-block; margin-left: 6px; min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--warn); color: var(--panel); font-size: 11px; line-height: 16px; text-align: center; }
  dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 16px; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dlg-head h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .stack { display: grid; gap: 6px; }
  .stack label { font-size: 12px; color: var(--muted); }
  .stack input { width: 100%; }
  .prov { border-top: 1px solid var(--line); padding: 12px 0; }
  .prov-head { display: flex; align-items: center; gap: 8px; }
  .prov-head h3 { font-size: 14px; margin: 0; }
  .pill.ok { color: var(--accent); border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  #keys-msg { min-height: 1.5em; margin: 8px 0 0; font-size: 13px; }
  #keys-msg.err { color: var(--err); }
  @media (max-width: 520px) { header .spacer { display: none; } }
  /* Last, so it beats the display rules above that share its specificity. */
  [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Albireo</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="where"></span>
  <span class="spacer"></span>
  <select id="provider" aria-label="Provider"></select>
  <input id="model" placeholder="model (default)" size="18" aria-label="Model">
  <button id="switch" type="button">Switch</button>
  <button id="abort" type="button" disabled>Stop</button>
  <button id="keys-open" type="button" hidden>API Keys<span id="keys-badge" class="badge" hidden>!</span></button>
</header>
<dialog id="keys" aria-labelledby="keys-title">
  <div class="dlg-head">
    <h2 id="keys-title">API Keys</h2>
    <button id="keys-close" type="button" aria-label="Close">×</button>
  </div>
  <p id="keys-state" class="muted"></p>
  <form id="unlock-form" class="stack" hidden>
    <label for="passphrase">Passphrase</label>
    <input id="passphrase" type="password" autocomplete="current-password" required>
    <div id="confirm-row" class="stack" hidden>
      <label for="passphrase2">Repeat passphrase</label>
      <input id="passphrase2" type="password" autocomplete="new-password">
    </div>
    <div class="actions"><button id="unlock-submit" type="submit" class="primary">Unlock</button></div>
  </form>
  <div id="provider-forms" hidden></div>
  <div class="actions"><button id="lock-btn" type="button" hidden>Lock vault</button></div>
  <p id="keys-msg" role="status"></p>
</dialog>
<main id="log"></main>
<footer>
  <!-- biome-ignore lint/a11y/noAutofocus: the message box is the panel's only primary input -->
  <form id="form"><input id="text" placeholder="Message Albireo…" autocomplete="off" autofocus><button type="submit" class="primary">Send</button></form>
</footer>
<script type="module">
const token = new URLSearchParams(location.search).get("token") ?? "";
const $ = (id) => document.getElementById(id);
const log = $("log");
let live = null;        // {el, reasoningEl, textEl}
let running = false;
const approvals = new Map();

function add(cls, text) {
  const el = document.createElement("div");
  el.className = `msg ${cls}`;
  el.textContent = text ?? "";
  log.appendChild(el);
  scroll();
  return el;
}
function scroll() { log.scrollTop = log.scrollHeight; }
function json(v) { try { return JSON.stringify(v, null, 2); } catch { return String(v); } }

function ensureLive() {
  if (live) return live;
  const el = document.createElement("div");
  el.className = "msg";
  const reasoningEl = document.createElement("div"); reasoningEl.className = "reasoning";
  const textEl = document.createElement("div");
  el.append(reasoningEl, textEl);
  log.appendChild(el);
  live = { el, reasoningEl, textEl };
  return live;
}

function setStatus(state) {
  running = state === "running";
  $("status").textContent = state;
  $("status").classList.toggle("running", running);
  $("abort").disabled = !running;
  $("switch").disabled = running;
}

function setWhere(provider, model) {
  $("where").textContent = `${provider} · ${model}`;
  currentProvider = provider;
  renderKeys();
}

// ---- API keys (encrypted vault; the server only ever returns masked hints) ----
const PROVIDERS = [["anthropic", "Anthropic"], ["openai", "OpenAI (and compatible endpoints)"]];
const forms = new Map();
let secrets = null;
let currentProvider = null;

async function api(path, body) {
  const headers = { "x-albireo-token": token };
  const init = body === undefined ? { headers } : { method: "POST", headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? `request failed (${res.status})`);
  return data;
}

async function loadSecrets() {
  try { secrets = await api("/secrets"); } catch { secrets = null; }
  renderKeys();
}

function keysMsg(text, isError = false) {
  $("keys-msg").textContent = text;
  $("keys-msg").classList.toggle("err", isError);
}

function describeVault(s) {
  if (s.error) return s.error;
  const holder = s.keychain ?? "your OS credential store";
  if (s.state === "uninitialized") {
    return s.protection === "os-keychain"
      ? `No keys saved yet. They will be encrypted with a key held by ${holder}.`
      : "No keys saved yet. No OS credential store is available here, so choose a passphrase (at least 8 characters) to protect them.";
  }
  if (s.state === "locked") return "The vault is locked. Enter its passphrase to use the saved keys.";
  return s.protection === "passphrase" ? "Keys are encrypted with your passphrase." : `Keys are encrypted with a key held by ${holder}.`;
}

function addField(parent, id, label, type) {
  const l = document.createElement("label");
  l.htmlFor = id;
  l.textContent = label;
  const input = document.createElement("input");
  input.id = id;
  input.type = type;
  input.autocomplete = "off";
  input.spellcheck = false;
  parent.append(l, input);
  return input;
}

function buildProviderForm(id, label) {
  const form = document.createElement("form");
  form.className = "prov stack";
  const head = document.createElement("div");
  head.className = "prov-head";
  const h = document.createElement("h3");
  h.textContent = label;
  const badge = document.createElement("span");
  badge.className = "pill";
  head.append(h, badge);
  form.append(head);
  const key = addField(form, `${id}-key`, "API key", "password");
  const base = addField(form, `${id}-base`, "Base URL (optional)", "url");
  const model = addField(form, `${id}-model`, "Default model (optional)", "text");
  base.placeholder = "provider default";
  model.placeholder = "provider default";
  const row = document.createElement("div");
  row.className = "actions";
  const save = document.createElement("button");
  save.type = "submit";
  save.className = "primary";
  save.textContent = "Save";
  const clear = document.createElement("button");
  clear.type = "button";
  clear.textContent = "Clear key";
  row.append(save, clear);
  form.append(row);
  for (const input of [base, model]) input.addEventListener("input", () => { form.dataset.dirty = "1"; });
  form.onsubmit = (e) => {
    e.preventDefault();
    const patch = { baseURL: base.value.trim(), model: model.value.trim() };
    if (key.value.trim()) patch.apiKey = key.value.trim();
    saveProvider(id, patch);
  };
  clear.onclick = () => saveProvider(id, { clearApiKey: true });
  forms.set(id, { form, badge, key, base, model, clear });
  return form;
}

function renderProviderForm(id, view) {
  const f = forms.get(id);
  f.badge.textContent = view.hasKey ? "encrypted" : "not configured";
  f.badge.classList.toggle("ok", view.hasKey);
  f.key.placeholder = view.hasKey ? `configured (${view.keyHint}) — leave blank to keep` : "paste API key";
  f.clear.hidden = !view.hasKey;
  if (!f.form.dataset.dirty) {
    f.base.value = view.baseURL ?? "";
    f.model.value = view.model ?? "";
  }
}

function renderKeys() {
  const open = $("keys-open");
  const s = secrets;
  open.hidden = !s?.enabled;
  if (!s?.enabled) return;
  const current = currentProvider && s.providers[currentProvider];
  const attention = s.state !== "unlocked" || (current && !current.hasKey);
  $("keys-badge").hidden = !attention;
  open.setAttribute("aria-label", attention ? "API Keys (needs attention)" : "API Keys");
  open.title = attention ? (s.state === "unlocked" ? `No ${currentProvider} key saved` : describeVault(s)) : "";

  const formsUsable = s.state === "unlocked" || (s.state === "uninitialized" && s.protection === "os-keychain");
  const creating = s.state === "uninitialized";
  $("keys-state").textContent = describeVault(s);
  $("unlock-form").hidden = formsUsable || s.protection !== "passphrase";
  $("confirm-row").hidden = !creating;
  $("passphrase").autocomplete = creating ? "new-password" : "current-password";
  $("passphrase2").required = creating;
  $("unlock-submit").textContent = creating ? "Create vault" : "Unlock";
  $("provider-forms").hidden = !formsUsable;
  $("lock-btn").hidden = !(s.state === "unlocked" && s.protection === "passphrase");
  for (const [id] of PROVIDERS) renderProviderForm(id, s.providers[id]);
}

async function saveProvider(id, patch) {
  keysMsg("Saving…");
  try {
    secrets = await api("/secrets/provider", { provider: id, ...patch });
    const f = forms.get(id);
    f.key.value = "";
    delete f.form.dataset.dirty;
    renderKeys();
    keysMsg(secrets.refreshPending ? "Saved. It takes effect when the current turn ends." : "Saved.");
  } catch (err) {
    keysMsg(err.message, true);
  }
}

function clearSecretInputs() {
  for (const f of forms.values()) f.key.value = "";
  $("passphrase").value = "";
  $("passphrase2").value = "";
}

$("provider-forms").append(...PROVIDERS.map(([id, label]) => buildProviderForm(id, label)));
$("keys-open").onclick = () => { keysMsg(""); renderKeys(); $("keys").showModal(); loadSecrets(); };
$("keys-close").onclick = () => $("keys").close();
$("keys").addEventListener("close", clearSecretInputs);
$("unlock-form").onsubmit = async (e) => {
  e.preventDefault();
  const passphrase = $("passphrase").value;
  if (secrets?.state === "uninitialized" && passphrase !== $("passphrase2").value) {
    keysMsg("The passphrases do not match.", true);
    return;
  }
  try {
    secrets = await api("/secrets/unlock", { passphrase });
    clearSecretInputs();
    renderKeys();
    keysMsg("Unlocked.");
  } catch (err) {
    keysMsg(err.message, true);
  }
};
$("lock-btn").onclick = async () => {
  try {
    secrets = await api("/secrets/lock", {});
    renderKeys();
    keysMsg("Locked.");
  } catch (err) {
    keysMsg(err.message, true);
  }
};

function approvalCard(ev) {
  const el = document.createElement("div");
  el.className = "msg approval";
  el.innerHTML = "<strong></strong><code></code><div class='row'><button class='primary'>Allow</button><button>Deny</button></div>";
  el.querySelector("strong").textContent = `Allow ${ev.name} (${ev.risk})?`;
  el.querySelector("code").textContent = json(ev.input);
  const [allow, deny] = el.querySelectorAll("button");
  allow.onclick = () => command({ type: "approve", id: ev.id, allow: true });
  deny.onclick = () => command({ type: "approve", id: ev.id, allow: false });
  approvals.set(ev.id, el);
  log.appendChild(el);
  scroll();
}

function toolCard(ev) {
  const el = document.createElement("div");
  el.className = "msg tool";
  el.id = `call-${ev.id}`;
  el.innerHTML = "<span class='name'></span> <span class='args'></span>";
  el.querySelector(".name").textContent = ev.name;
  el.querySelector(".args").textContent = JSON.stringify(ev.input);
  log.appendChild(el);
  scroll();
}

function handle(ev) {
  switch (ev.type) {
    case "snapshot":
      log.replaceChildren(); live = null; approvals.clear();
      for (const e of ev.log) handle(e);
      if (ev.live) { const l = ensureLive(); l.reasoningEl.textContent = ev.live.reasoning; l.textEl.textContent = ev.live.text; }
      for (const p of ev.pending) approvalCard(p);
      setStatus(ev.status); setWhere(ev.provider, ev.model);
      $("provider").replaceChildren(...ev.providers.map((p) => new Option(p, p, false, p === ev.provider)));
      loadSecrets();
      break;
    case "secrets_changed": loadSecrets(); break;
    case "user": add("user", ev.text); break;
    case "text_delta": ensureLive().textEl.textContent += ev.text; scroll(); break;
    case "reasoning_delta": ensureLive().reasoningEl.textContent += ev.text; scroll(); break;
    case "assistant_end": {
      if (!live && ev.text) { const l = ensureLive(); l.textEl.textContent = ev.text; }
      if (live && !live.textEl.textContent && !live.reasoningEl.textContent) live.el.remove();
      live = null;
      break;
    }
    case "tool_call": toolCard(ev); break;
    case "approval_request": approvalCard(ev); break;
    case "approval_resolved": approvals.get(ev.id)?.remove(); approvals.delete(ev.id); break;
    case "tool_result": {
      const card = $(`call-${ev.id}`);
      if (!card) break;
      if (ev.isError) card.classList.add("err");
      const pre = document.createElement("pre"); pre.textContent = ev.content;
      card.appendChild(pre); scroll();
      break;
    }
    case "provider_changed": setWhere(ev.provider, ev.model); $("provider").value = ev.provider; add("notice", `Switched to ${ev.provider} · ${ev.model}`); break;
    case "status": setStatus(ev.state); break;
    case "notice": add("notice", ev.text); break;
    case "error": add("error", ev.message); break;
  }
}

async function command(body) {
  const res = await fetch("/command", { method: "POST", headers: { "content-type": "application/json", "x-albireo-token": token }, body: JSON.stringify(body) });
  if (!res.ok) add("error", (await res.json().catch(() => ({}))).error ?? "request failed");
}

const es = new EventSource(`/events?token=${encodeURIComponent(token)}`);
es.onmessage = (e) => handle(JSON.parse(e.data));
es.onerror = () => { $("status").textContent = "disconnected"; $("status").classList.remove("running"); };

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  command({ type: "send", text });
};
$("abort").onclick = () => command({ type: "abort" });
$("switch").onclick = () => command({ type: "switch", provider: $("provider").value, model: $("model").value.trim() });
</script>
</body>
</html>
